plugins {
    id 'com.android.application'
}

// Appka schválně nemá žádné závislosti (ani AndroidX): je to pár set řádků
// proti systémovému API a čím míň toho táhne, tím snáz se buildí a ověřuje.
android {
    namespace 'cz.twentyone.dialer'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.twentyone.dialer'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Podpisový klíč NENÍ v repu — cesta a heslo se předávají zvenčí
    // (android/build-apk.sh na build stroji). Bez nich se release build
    // přeskočí a zůstane jen debug.
    signingConfigs {
        release {
            def ks = System.getenv('GSM2SIP_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('GSM2SIP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GSM2SIP_KEY_ALIAS')
                keyPassword System.getenv('GSM2SIP_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('GSM2SIP_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }
}
