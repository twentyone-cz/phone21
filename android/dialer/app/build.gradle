plugins {
    id 'com.android.application'
}

// Appka schválně nemá žádné závislosti (ani AndroidX): je to pár set řádků
// proti systémovému API a čím míň toho táhne, tím snáz se buildí a ověřuje.
android {
    namespace 'cz.twentyone.dialer'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.twentyone.dialer'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
