; GSM2SIP — dialplan, oba směry
;
; ŠABLONA — token SIP_USER (v syntaxi dolar+složené závorky) nahrazuje
; configure.sh z .env. Asteriskové proměnné (${EXTEN}, ${CALLERID(num)}, ...)
; zůstávají netknuté — nahrazují se výhradně tokeny SIP_USER a SIP_PASSWORD.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
SOFTPHONE=PJSIP/${SIP_USER}

; --- Normalizace čísla na E.164 ---------------------------------------------
; Invariant brány: všechno, co vidí Linphone (CallerID hovoru, odesílatel SMS,
; číslo v potvrzence), je E.164 s „+" — jinak liblinphone zakládá pro tentýž
; protějšek dvě konverzace (např. 606... vs +420606...). Volá se Gosub s číslem
; v ARG1, výsledek je v ${GOSUB_RETVAL}.
;
; Pravidla (COUNTRY_CODE je token z .env, po renderu literál např. 420):
;   +...                 → beze změny (už E.164)
;   00<cc><číslo>        → +<cc><číslo>
;   <CC> + 9 číslic      → +<CC>...        (např. 420606123456)
;   9 číslic             → +<CC> + číslo   (národní mobil/pevná)
;   cokoli jiného        → beze změny: krátká čísla (112, dárcovská 87x,
;                          3030), *kódy, alfanumerická ID (AIRBANK)
; STEJNÁ pravidla implementuje normalize_msisdn() ve webui/app.py — při změně
; upravit obě místa!
[number-normalize]
exten => s,1,Set(NN=${FILTER(+0-9,${ARG1})})
 same => n,GotoIf($["${NN}" != "${ARG1}"]?asis)
 same => n,GotoIf($["${NN:0:1}" = "+"]?asis)
 same => n,GotoIf($["${NN:0:2}" = "00" & ${LEN(${NN})} > 4]?intl)
 same => n,GotoIf($["${NN:0:${LEN(${COUNTRY_CODE})}}" = "${COUNTRY_CODE}" & ${LEN(${NN})} = ${LEN(${COUNTRY_CODE})} + 9]?cc)
 same => n,GotoIf($[${LEN(${NN})} = 9]?nat)
 same => n(asis),Return(${ARG1})
 same => n(intl),Return(+${NN:2})
 same => n(cc),Return(+${NN})
 same => n(nat),Return(+${COUNTRY_CODE}${NN})

; --- Příchozí: mobilní síť -> softphone -------------------------------------
; chan_quectel doručí příchozí hovor sem (context=quectel-incoming, exten=s).

[quectel-incoming]
exten => s,1,NoOp(GSM prichozi od ${CALLERID(num)})
 same => n,Gosub(number-normalize,s,1(${CALLERID(num)}))
 same => n,Set(CALLERID(num)=${GOSUB_RETVAL})
 same => n,Set(CALLERID(name)=GSM ${CALLERID(num)})
 same => n,Dial(${SOFTPHONE},45)
; Telefon offline (CHANUNAVAIL/CONGESTION = kontakt nedosažitelný) → zařadit
; notifikaci a obsloužit volajícího. NOANSWER/BUSY sem záměrně nepatří:
; telefon zvonil a zmeškaný hovor si Linphone ukáže sám.
; Kauzy 17 (obsazeno) a 21 (odmítnuto) znamenají, že telefon odpověděl —
; nejde o nedostupnost, notifikace se v takovém případě neposílá.
 same => n,NoOp(Dial konec: DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,GotoIf($[("${DIALSTATUS}"="CHANUNAVAIL" | "${DIALSTATUS}"="CONGESTION") & "${HANGUPCAUSE}"!="17" & "${HANGUPCAUSE}"!="21"]?offline)
 same => n,Hangup()
; Notifikace jde přes existující SMS retry frontu jako zpráva OD volajícího —
; přistane ve vlákně chatu jeho čísla, až se telefon zase zaregistruje.
; Dedup: od téhož čísla max jedna notifikace za 10 minut (netrpělivý volající
; to zkusí 5x za minutu). Skryté číslo (prázdné) se nenotifikuje.
 same => n(offline),Set(SAFENUM=${FILTER(+0-9,${CALLERID(num)})})
 same => n,GotoIf($[${LEN(${SAFENUM})}=0]?serve)
 same => n,Set(LASTNOTIF=${DB(gsm2sip/missednotif/${SAFENUM})})
 same => n,GotoIf($[${EPOCH} - 0${LASTNOTIF} < 600]?serve)
 same => n,Set(DB(gsm2sip/missednotif/${SAFENUM})=${EPOCH})
 same => n,System(/usr/local/gsm2sip/sms-queue.sh missed '${SAFENUM}')
; Chování k volajícímu řídí přepínač z web UI (AstDB gsm2sip/missed_mode):
;   ring (default) — nezvedat, jen čekat: vyzváněcí tón generuje GSM síť,
;                    volajícímu se nic neúčtuje a po ~30 s to vypadá jako
;                    nezvednutý telefon;
;   announce       — přijmout a přehrát hlásku nedostupnosti (chan_quectel
;                    neumí early media, bez Answer by hláska nešla slyšet).
;                    POZOR: přijetí = volajícímu se dle tarifu účtuje.
 same => n(serve),GotoIf($["${DB(gsm2sip/missed_mode)}"="announce"]?ann)
 same => n,Wait(30)
 same => n,Hangup()
 same => n(ann),Answer()
 same => n,Wait(1)
 same => n,Playback(ss-noservice)
 same => n,Playtones(congestion)
 same => n,Wait(5)
 same => n,Hangup()

; --- Příchozí SMS (mobil → Linphone chat) — KROK 1 ---
; Driver sem startuje Local/sms@quectel-incoming s proměnnou SMS = JSON
; {from, ts, msg, ref, parts}. Rozparsujeme přes JSON_DECODE a doručíme jako
; SIP MESSAGE do Linphone. MESSAGE_SEND_STATUS řekne, jestli šlo na
; registrovaný kontakt (SUCCESS) nebo ne (telefon offline → FAILURE).
; From i To se nastavují explicitně (sanitizovaná user část, identita účtu
; v To) — jinak klient zprávu sice přijme, ale nemusí ji zobrazit.
; Nedoručené zprávy jdou do žurnálu a retry fronty (viz sms-queue.sh);
; každý pokus je nový MessageSend.
exten => sms,1,Log(NOTICE,GSM2SIP SMS-IN prijem od ${JSON_DECODE(SMS,from)} raw=${SMS})
 same => n,Gosub(sms-deliver,s,1)
 same => n,Log(NOTICE,GSM2SIP SMS-IN doruceni do Linphone = ${DELIVERY})
 same => n,System(/usr/local/gsm2sip/sms-queue.sh journal 'recv-${DELIVERY}' '${BASE64_ENCODE(${SMS})}')
 same => n,ExecIf($["${DELIVERY}"!="SUCCESS"]?System(/usr/local/gsm2sip/sms-queue.sh enqueue '${BASE64_ENCODE(${SMS})}' 0))
 same => n,Hangup()

; Naplánovaný opakovaný pokus (spouští call file; QID/RETRYN/ORIGTS ze
; Setvar). Doručení se zkouší JEN když má endpoint registrovaný kontakt —
; jinak se pokus tiše přeplánuje (tik ve stropu 10 min je skoro zadarmo).
; Give-up řídí TTL 48 h ve sms-queue.sh, ne počet pokusů.
; Pojistka: pokud kanál naběhne dřív než NOTBEFORE, dočká se zbytek doby
; (jinak by vznikla smyčka). Prázdné NOTBEFORE = bez čekání.
exten => smsretry,1,GotoIf($[${EPOCH} >= 0${NOTBEFORE}]?load)
 same => n,NoOp(GSM2SIP SMS-RETRY ${QID} odpalen predcasne, cekam $[0${NOTBEFORE} - ${EPOCH}] s)
 same => n,Wait($[0${NOTBEFORE} - ${EPOCH}])
 same => n(load),Set(SMS=${BASE64_DECODE(${SHELL(cat /var/lib/gsm2sip/queue/${FILTER(0-9,${QID})}.b64)})})
 same => n,GotoIf($[${LEN(${SMS})}=0]?empty)
 same => n,GotoIf($[${LEN(${PJSIP_AOR(${SIP_USER},contact)})}=0]?offline)
 same => n,Log(NOTICE,GSM2SIP SMS-RETRY ${QID} pokus ${RETRYN} od ${JSON_DECODE(SMS,from)})
 same => n,Gosub(sms-deliver,s,1)
 same => n,Log(NOTICE,GSM2SIP SMS-RETRY ${QID} vysledek = ${DELIVERY})
 same => n,GotoIf($["${DELIVERY}"="SUCCESS"]?ok)
 same => n,System(/usr/local/gsm2sip/sms-queue.sh enqueue '${BASE64_ENCODE(${SMS})}' ${RETRYN} ${FILTER(0-9,${ORIGTS})})
 same => n,System(/usr/local/gsm2sip/sms-queue.sh done ${QID})
 same => n,Hangup()
 same => n(ok),System(/usr/local/gsm2sip/sms-queue.sh journal 'delivered-retry${RETRYN}' '${BASE64_ENCODE(${SMS})}')
 same => n,System(/usr/local/gsm2sip/sms-queue.sh done ${QID})
 same => n,Hangup()
 same => n(offline),System(/usr/local/gsm2sip/sms-queue.sh enqueue '${BASE64_ENCODE(${SMS})}' ${RETRYN} ${FILTER(0-9,${ORIGTS})})
 same => n,System(/usr/local/gsm2sip/sms-queue.sh done ${QID})
 same => n,Hangup()
 same => n(empty),Log(WARNING,GSM2SIP SMS-RETRY ${QID} payload chybi — pokus zahazuji)
 same => n,Hangup()

; --- Potvrzení odeslání odchozí SMS do sítě (submit report) — KROK 1 ---
; Po odeslání SMS driver sem startuje Local/report@quectel-incoming s REPORT
; JSON. success=1 + refid = SMS opustila RPi do sítě operátora; success=0 =
; chyba. Potvrzení pošleme zpět do Linphone chatu (jako zpráva od příjemce).
exten => report,1,NoOp(REPORT ${REPORT})
 same => n,Set(OK=${JSON_DECODE(REPORT,success)})
 same => n,Set(DST=${JSON_DECODE(REPORT,number)})
; Číslo v reportu vrací modem a jeho tvar se může lišit od toho, co uživatel
; vytočil — bez normalizace by potvrzenka založila v Linphone druhé vlákno.
 same => n,Gosub(number-normalize,s,1(${DST}))
 same => n,Set(DST=${GOSUB_RETVAL})
; Vnořený klíč se v JSON_DECODE odděluje tečkou ve druhém argumentu.
 same => n,ExecIf($["${OK}"="1"]?Set(TXT=✓ SMS odeslána do sítě (ref ${JSON_DECODE(REPORT,report.refid)})))
 same => n,ExecIf($["${OK}"!="1"]?Set(TXT=✗ SMS se nepodařilo odeslat: ${JSON_DECODE(REPORT,report.info)}))
 same => n,Set(MESSAGE(body)=${TXT})
 same => n,Set(MESSAGE(from)=sip:${FILTER(+0-9A-Za-z._-,${DST})}@${SIP_DOMAIN})
 same => n,Set(MESSAGE(to)=sip:${SIP_USER}@${SIP_DOMAIN})
 same => n,MessageSend(pjsip:${SIP_USER})
 same => n,Hangup()

; --- Doručení SMS do softphonu (subrutina; vstup: ${SMS} = JSON) ------------
; From: sanitizovaná user část (RFC 3261), doména musí být rozložitelná.
; To: identita účtu — jinak klient zprávu nemusí zobrazit.
; Výstup: ${DELIVERY} = SUCCESS/FAILURE.
[sms-deliver]
exten => s,1,Set(SMSFROM=${JSON_DECODE(SMS,from)})
 same => n,Gosub(number-normalize,s,1(${SMSFROM}))
 same => n,Set(SAFEFROM=${FILTER(+0-9A-Za-z._-,${GOSUB_RETVAL})})
 same => n,ExecIf($[${LEN(${SAFEFROM})}=0]?Set(SAFEFROM=neznamy))
 same => n,Set(MESSAGE(body)=${JSON_DECODE(SMS,msg)})
 same => n,Set(MESSAGE(from)=sip:${SAFEFROM}@${SIP_DOMAIN})
 same => n,Set(MESSAGE(to)=sip:${SIP_USER}@${SIP_DOMAIN})
 same => n,MessageSend(pjsip:${SIP_USER})
 same => n,Set(DELIVERY=${MESSAGE_SEND_STATUS})
 same => n,Return()

; --- Odchozí: softphone -> mobilní síť --------------------------------------
; Protistrana vidí české číslo SIM v modemu.

[from-softphone]
; Echo test — ověření obousměrného zvuku SIP větve bez SIM/hovoru:
exten => 600,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Self-test ZOBRAZENÍ chatu v Linphone (bez příchozí SMS). Vytoč kód, hovor
; hned zavěsí, a brána pošle sama sobě do Linphone testovací zprávu s různým
; tvarem odesílatele. Koukni do Linphone, KTERÁ z nich se zobrazí:
;   *981 = odesílatel  sip:+420111222333@${SIP_DOMAIN}  (číslo @ IP serveru)
;   *982 = odesílatel  sip:+420111222333@gsm2sip        (původní, podezřelá doména)
;   *983 = odesílatel  sip:420111222333@${SIP_DOMAIN}    (bez +)
exten => *981,1,Set(MESSAGE(from)=sip:+420111222333@${SIP_DOMAIN})
 same => n,Set(MESSAGE(body)=TEST981 odesilatel cislo@IP-serveru)
 same => n,MessageSend(pjsip:${SIP_USER})
 same => n,Hangup()
exten => *982,1,Set(MESSAGE(from)=sip:+420111222333@gsm2sip)
 same => n,Set(MESSAGE(body)=TEST982 odesilatel cislo@gsm2sip)
 same => n,MessageSend(pjsip:${SIP_USER})
 same => n,Hangup()
exten => *983,1,Set(MESSAGE(from)=sip:420111222333@${SIP_DOMAIN})
 same => n,Set(MESSAGE(body)=TEST983 odesilatel bez plus)
 same => n,MessageSend(pjsip:${SIP_USER})
 same => n,Hangup()

; Self-test normalizace čísel: vytoč *984, do chatu přijde zpráva s převody
; vzorků. Očekávané: první čtyři → +420604111222, poslední dva beze změny.
exten => *984,1,Gosub(number-normalize,s,1(00420604111222))
 same => n,Set(R=00420604111222 -> ${GOSUB_RETVAL})
 same => n,Gosub(number-normalize,s,1(420604111222))
 same => n,Set(R=${R} | 420604111222 -> ${GOSUB_RETVAL})
 same => n,Gosub(number-normalize,s,1(604111222))
 same => n,Set(R=${R} | 604111222 -> ${GOSUB_RETVAL})
 same => n,Gosub(number-normalize,s,1(+420604111222))
 same => n,Set(R=${R} | +420604111222 -> ${GOSUB_RETVAL})
 same => n,Gosub(number-normalize,s,1(87777))
 same => n,Set(R=${R} | 87777 -> ${GOSUB_RETVAL})
 same => n,Gosub(number-normalize,s,1(AIRBANK))
 same => n,Set(R=${R} | AIRBANK -> ${GOSUB_RETVAL})
 same => n,Set(MESSAGE(from)=sip:normtest@${SIP_DOMAIN})
 same => n,Set(MESSAGE(to)=sip:${SIP_USER}@${SIP_DOMAIN})
 same => n,Set(MESSAGE(body)=TEST984 ${R})
 same => n,MessageSend(pjsip:${SIP_USER})
 same => n,Hangup()

; Self-test notifikace zmeškaného hovoru: vytoč *985 — zařadí do fronty
; „Zmeškaný hovor" od +420111222333; do stropu backoffu (60 s při online
; telefonu) přijde do chatu toho čísla zpráva. Pípnutí = enqueue proběhl.
exten => *985,1,Answer()
 same => n,System(/usr/local/gsm2sip/sms-queue.sh missed '+420111222333')
 same => n,Playback(beep)
 same => n,Hangup()

; Test odchozí SMS bez závislosti na chat/messaging klienta: vytoč *99 + číslo
; (např. *99722123456). Brána pošle SMS "GSM2SIP test" na to číslo přes modem.
; Používá jen HOVOROVOU funkci klienta; ověřuje bránovou cestu SMS→síť.
; EXTEN:3 = číslo bez prefixu *99. Po odeslání přijde do "hovoru" pípnutí.
exten => _*99.,1,NoOp(Test SMS na ${EXTEN:3})
 same => n,Answer()
 same => n,QUECTEL_SEND_SMS(quectel0,${EXTEN:3},GSM2SIP test SMS)
 same => n,Playback(beep)
 same => n,Hangup()

; Národní i mezinárodní formát — vytáčí se normalizovaný (E.164) tvar.
exten => _X.,1,Gosub(number-normalize,s,1(${EXTEN}))
 same => n,NoOp(Odchozi na ${GOSUB_RETVAL} (vytoceno ${EXTEN}))
 same => n,Dial(Quectel/quectel0/${GOSUB_RETVAL},60)
 same => n,Hangup()

exten => _+X.,1,Gosub(number-normalize,s,1(${EXTEN}))
 same => n,NoOp(Odchozi na ${GOSUB_RETVAL} (vytoceno ${EXTEN}))
 same => n,Dial(Quectel/quectel0/${GOSUB_RETVAL},60)
 same => n,Hangup()

; POZN. hangup detection: modem nemá spolehlivý URC o ukončení hovoru.
; Řeší se ve Fázi 4 přes ccinfo/dsci (RoEdAl fork) — jinak visí kanály.

; --- Odchozí SMS (Linphone chat → mobil) — KROK 1 ---
; Linphone pošle SIP MESSAGE na SIP adresu <číslo>@brána; přistane sem
; (message_context=messages na endpointu). Číslo = ${EXTEN}, text je už
; v MESSAGE(body). Pošleme přes chan_quectel technologii `mobile`.
; Potvrzení submitu do sítě přijde asynchronně přes exten `report` výše.
[messages]
; Číslo se předává jako TŘETÍ argument MessageSend — neměnit.
exten => _[+0-9].,1,Gosub(number-normalize,s,1(${EXTEN}))
 same => n,Set(SMSDST=${GOSUB_RETVAL})
 same => n,NoOp(Odchozi SMS na ${SMSDST} (vlakno ${EXTEN}): ${MESSAGE(body)})
 same => n,Set(MESSAGE(to)=${SMSDST})
 same => n,MessageSend(mobile:quectel0,${SIP_USER},${SMSDST})
 same => n,NoOp(Predano do fronty modemu: ${MESSAGE_SEND_STATUS})

; Alfanumeričtí odesílatelé (banky, "AIRBANK") — nelze odpovědět. Pokud
; uživatel omylem odpoví na takové vlákno, číslo nebude číselné a přistane
; sem — srozumitelně to odmítneme (ne tiché zahození).
exten => _[A-Za-z].,1,NoOp(Odchozi SMS na alfanumericke ${EXTEN} - nelze)
 same => n,Set(MESSAGE(body)=✗ Na odesílatele '${EXTEN}' nelze odpovědět (alfanumerické ID).)
 same => n,Set(MESSAGE(from)=sip:${FILTER(+0-9A-Za-z._-,${EXTEN})}@${SIP_DOMAIN})
 same => n,Set(MESSAGE(to)=sip:${SIP_USER}@${SIP_DOMAIN})
 same => n,MessageSend(pjsip:${SIP_USER})
