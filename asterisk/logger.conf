; Phone21 — logování na konzoli kontejneru (docker logs asterisk)
; + do souboru pro web UI diagnostiku (sdílený volume runtime/astlog)
[general]
; při 'logger rotate' se generace posouvají (messages.log.0 = poslední);
; starší generace uklízí smyčka v entrypointu
rotatestrategy = rotate

[logfiles]
console => notice,warning,error,verbose(3)
; verbose(3) i do souboru: bez něj chybí NoOp() z dialplanu, takže se u SMS
; nedá zpětně zjistit, co přesně přišlo v REPORT JSON od modemu — a právě to
; je potřeba, když odchozí SMS selže. (AT provoz je až v debug; ten se zapíná
; dočasně přes `core set debug 3`, do souboru natrvalo ne — zahltil by tail
; v web UI.)
messages.log => notice,warning,error,verbose(3)

; Samostatný cíl pro debug — hlavně AT komunikace s modemem (chan_quectel ji
; loguje na debug úrovni). Zůstává PRÁZDNÝ, dokud se debug nezapne za běhu:
;   docker exec asterisk asterisk -rx "core set debug 3"
;   ... reprodukovat problém ...
;   docker exec asterisk asterisk -rx "core set debug 0"
; Odděleně od messages.log schválně: debug by zahltil tail v web UI.
debug.log => debug
