; GSM2SIP — základ Asterisku (jinak by jel na built-in defaultech s varováním)
; Sekce directories je AKTIVNÍ (bez „(!)"): cesty odpovídají Ubuntu balíku
; asterisk v image, jediná odchylka je astdbdir — AstDB musí ležet na
; persistentním volume, protože drží přepínač missed_mode a dedup zmeškaných
; hovorů (a nově díky tomu přežijí recreate kontejneru i PJSIP registrace).
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/gsm2sip
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk

[options]
; posílat ticho, když se nic nepřehrává — drží RTP tok živý (NAT/tunel)
transmit_silence = yes
