; GSM2SIP — základ Asterisku (jinak by jel na built-in defaultech s varováním)
; Sekce directories je AKTIVNÍ (bez „(!)"), ale přepisuje JEDINOU cestu:
; astdbdir — AstDB musí ležet na persistentním volume, protože drží přepínač
; missed_mode a dedup zmeškaných hovorů (a díky tomu přežijí recreate
; kontejneru i PJSIP registrace). Ostatní cesty se NECHÁVAJÍ na kompilačních
; defaultech Ubuntu balíku — dřívější pokus vyjmenovat je tu ručně přepsal
; astdatadir na /var/lib/asterisk, jenže balík má dokumentační XML
; v /usr/share/asterisk → stasis nenašel dokumentaci typů a Asterisk
; padal hned při startu („Stasis initialization failed").
[directories]
astdbdir => /var/lib/gsm2sip

[options]
; posílat ticho, když se nic nepřehrává — drží RTP tok živý (NAT/tunel)
transmit_silence = yes
