; GSM2SIP — chan_quectel (RoEdAl fork) pro výrobce modem
;
; KLÍČOVÉ ROZHODNUTÍ (ověřeno na místě, neměnit):
;   - USB audio (USB audio) NENÍ k dispozici — audio jde přes sériový PCM port.
;   - PCM je 8 kHz / 16 bit linear (kodek slin).
;   - uac/alsadev se NENASTAVUJÍ. /dev/snd se nikam nemountuje.
;   - ttyUSB4 = PCM audio port (AT na něm neodpovídá — to je správně).
;   - Nikdy nespouštět zakázaný AT příkaz (zmizí ttyUSB porty).
;
; POZOR na sémantiku RoEdAl forku (jiná než starý chan_quectel!):
;   - rxgain/txgain: 0–65535 nebo procenta, -1 = default modemu.
;     Hodnota 0 znamená ZTLUMENO, ne "beze změny"!
;   - dsci=on: stav hovoru přes URC URC — modem neumí Quectel ccinfo;
;     bez toho nefunguje spolehlivá detekce zavěšení (visící kanály).

[general]
interval=15                 ; interval kontroly modemu [s]
smsdb=/var/lib/asterisk/smsdb   ; SMS databáze (Fáze 6); default :memory: nepřežije restart

[quectel0]
audio=/dev/ttyUSB4          ; PCM audio port (výrobce sériové audio, if04)
data=/dev/ttyUSB2           ; AT port (if02)
context=quectel-incoming    ; příchozí hovory (a SMS hook ve Fázi 6)
group=0                     ; Dial(Quectel/g0/...) — skupina zařízení
exten=s                     ; příchozí hovor přistane na exten s
dsci=on                     ; modem: hangup detection přes URC

; --- Audio úrovně (Fáze 4: doladit podle skutečné hlasitosti/echa) ---
rxgain=-1                   ; -1 = default modemu (0 by ztlumilo!)
txgain=-1                   ; -1 = default modemu (0 by ztlumilo!)

; --- DTMF ---
dtmf_duration=120           ; délka generovaného tónu do GSM [ms]
;dtmf=on                    ; detekce příchozího DTMF z GSM strany (default off)

; --- SMS (Fáze 6) ---
autodeletesms=yes           ; mazat SMS ze SIM po přečtení — paměť SIM je malá

; --- Volitelné vylepšení (zapnout až po ověření základních hovorů) ---
;slin16=yes                 ; 16kHz audio — modem umí, lepší kvalita

; --- NEnastavovat (viz ověřená fakta) ---
;uac=                       ; modem USB audio nemá
;alsadev=                   ; žádná ALSA zvukovka neexistuje
