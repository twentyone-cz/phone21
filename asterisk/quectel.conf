; GSM2SIP — konfigurace ovladače LTE modemu.
;
; Hodnoty níže jsou odladěné pro podporovaný hardware — neměnit naslepo.

[general]
interval=15                 ; interval kontroly modemu [s]
smsdb=/var/lib/gsm2sip/smsdb    ; SMS databáze (multipart skládání); na persistentním volume

[quectel0]
audio=/dev/ttyUSB4          ; audio port modemu
data=/dev/ttyUSB2           ; AT port
context=quectel-incoming    ; příchozí hovory a SMS
group=0                     ; Dial(Quectel/g0/...) — skupina zařízení
exten=s                     ; příchozí hovor přistane na exten s
dsci=on                     ; detekce zavěšení

; --- Audio úrovně ---
rxgain=-1                   ; -1 = ponechat nastavení modemu
txgain=-1                   ; -1 = ponechat nastavení modemu

; --- DTMF ---
dtmf_duration=120           ; délka generovaného tónu do GSM [ms]
;dtmf=on                    ; detekce příchozího DTMF z GSM strany (default off)

; --- SMS ---
; KROK 1 testu: no — SMS zůstává na SIM, ať jde tok testovat opakovaně.
; KROK 2 (žurnál na RPi + retry) zapne mazání až po zápisu na disk; do té
; doby hlídej zaplnění SIM (quectel sms delete all quectel0).
autodeletesms=no

; --- Volitelné (zapínat až po ověření základních hovorů) ---
;slin16=yes
