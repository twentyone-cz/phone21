; GSM2SIP — moduly: autoload + vypnuté zvukové/legacy kanály
[modules]
autoload=yes

; Konzolové/ALSA kanály nedávají v kontejneru smysl (a ALSA tu není):
noload => chan_alsa.so
noload => chan_console.so
noload => chan_oss.so

; Starý SIP stack — používáme výhradně PJSIP:
noload => chan_sip.so

; IAX2 nepoužíváme, ale autoload ho zapne a nechá poslouchat na 0.0.0.0:4569.
; Zbytečně exponovaný protokol = zbytečný povrch (firewall ho blokuje také,
; ale nejlepší port je ten, který se vůbec neotevře):
noload => chan_iax2.so

; chan_dongle (jen ve fallback image) — používáme chan_quectel:
noload => chan_dongle.so
