; GSM2SIP — PJSIP: jeden softphone endpoint (Linphone)
;
; ŠABLONA — tokeny SIP_USER a SIP_PASSWORD (v syntaxi dolar+složené závorky)
; nahrazuje configure.sh z .env. Změny dělej v šabloně v repu a přegeneruj
; s ./configure.sh --force; runtime kopii ručně needituj.
;
; BEZPEČNOST: SIP se NIKDY nevystavuje na veřejnou IP. Transport poslouchá
; na 0.0.0.0, ale síťově smí být dosažitelný jen z LAN a tunelu (Tailscale/
; WireGuard) — na routeru nesmí existovat port forward 5060/RTP.

[global]
type=global
endpoint_identifier_order=username,ip
user_agent=GSM2SIP

; --- Transporty -------------------------------------------------------------
; Linphone: TCP (delší NAT keepalive, méně probouzení rádia než UDP — viz
; zadání režimu A). Přes tunel není potřeba NAT traversal.

; UDP záměrně vypnutý — režim A je TLS/TCP. Odkomentuj jen pro ladění na LAN:
;[transport-udp]
;type=transport
;protocol=udp
;bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; TLS připraveno jako volba (Fáze 5 / režim B). Vyžaduje certifikát:
;[transport-tls]
;type=transport
;protocol=tls
;bind=0.0.0.0:5061
;cert_file=/etc/asterisk/keys/asterisk.crt
;priv_key_file=/etc/asterisk/keys/asterisk.key
;method=tlsv1_2

; --- Softphone endpoint -----------------------------------------------------

[${SIP_USER}]
type=endpoint
context=from-softphone
disallow=all
allow=alaw                  ; 8 kHz — odpovídá PCM audiu modemu (slin 8 kHz)
allow=ulaw
direct_media=no             ; RTP vždy přes Asterisk (most na chan_quectel)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
auth=${SIP_USER}-auth
aors=${SIP_USER}

[${SIP_USER}-auth]
type=auth
auth_type=userpass
username=${SIP_USER}
password=${SIP_PASSWORD}

[${SIP_USER}]
type=aor
max_contacts=3              ; softphone se může hlásit z více sítí souběžně
qualify_frequency=60
remove_existing=yes
