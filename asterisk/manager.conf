; GSM2SIP — AMI pro webové UI (jen localhost; heslo z .env přes configure.sh)
[general]
enabled = yes
bindaddr = 127.0.0.1
port = 5038

[gsm2sip-webui]
secret = ${AMI_PASSWORD}
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
read = command,message
write = command,message,originate
writetimeout = 5000
