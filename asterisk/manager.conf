; GSM2SIP — AMI pro webové UI (default jen localhost; heslo z .env)
; AMI_BIND/AMI_PERMIT: default localhost (LXC režim, webui na host síti);
; na Umbrelu webui běží v bridge síti → bind 0.0.0.0 + permit jen app subnet
; (nastavuje entrypoint kontejneru z env, deny 0.0.0.0/0 zůstává).
[general]
enabled = yes
bindaddr = ${AMI_BIND}
port = 5038

[gsm2sip-webui]
secret = ${AMI_PASSWORD}
deny = 0.0.0.0/0.0.0.0
permit = ${AMI_PERMIT}
read = command,message
write = command,message,originate
writetimeout = 5000
