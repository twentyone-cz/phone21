version: "3.7"

# GSM2SIP pro Umbrel — asterisk (host síť, USB modem) + webui (bridge,
# za app_proxy) + tailnet sidecar (privátní síť telefon↔brána, login server
# CockScale). Obrazy jsou multi-arch (amd64+arm64) z ghcr.io —
# tagy aktualizuje umbrel/build-images.sh, před publikací připnout digestem.

services:
  app_proxy:
    environment:
      APP_HOST: jednadvacet-gsm2sip_webui_1
      APP_PORT: 8090

  asterisk:
    image: ghcr.io/twentyone-cz/gsm2sip-asterisk:0.9.24@sha256:8afcf40cdfd0c4e013d3405bb90fb66dda363cd4bfe0377077f0d6dd011cb261
    restart: on-failure
    network_mode: host            # RTP rozsah portů + SIP na tailnet IP
    # zdraví = CLI socket ústředny odpovídá (jen diagnostika pro docker ps;
    # restart policy na unhealthy nereaguje); start_period kryje čekání
    # entrypointu na adresu privátní sítě před startem ústředny
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      TZ: ${TZ:-Europe/Prague}
      GSM2SIP_SELFCONFIG: "1"     # render konfigurace při každém startu
      SUPERVISE: "1"              # restart procesu po pádu/watchdogu
      WATCHDOG_INTERNAL: "1"      # hlídání modemu (Umbrel nemá host systemd)
      MBN_INTERNAL: "1"           # VoLTE carrier profil (viz mbn-profile.sh)
      # VoLTE profil: auto = volba podle mapy operátor→profil (MBN_MAP);
      # mapa jde dodat souborem mbn.env v datovém adresáři aplikace
      MBN_PROFILE: ${MBN_PROFILE:-auto}
      MBN_MAP: ${MBN_MAP:-}
      COUNTRY_CODE: "420"
      # AMI: webui běží v bridge síti appky → bind všude, ale ACL pouští jen
      # localhost a interní Umbrel subnety (deny 0.0.0.0/0 je v šabloně):
      AMI_BIND: 0.0.0.0
      AMI_PERMIT: "127.0.0.1/255.255.255.255,10.21.0.0/255.255.0.0"
      # Ostrovní režim (failover internetu přes modem) — opt-in:
      WWAN_FAILOVER: ${WWAN_FAILOVER:-0}
      WWAN_APN: ${WWAN_APN:-internet}
    cap_add:
      - NET_ADMIN                 # ostrovní režim: wwan0 + default route
    group_add:
      - "20"                      # dialout
    devices:
      - "/dev/serial/by-id/usb-SimTech__Incorporated_SimTech__Incorporated_0123456789ABCDEF-if02-port0:/dev/ttyUSB2"
      - "/dev/serial/by-id/usb-SimTech__Incorporated_SimTech__Incorporated_0123456789ABCDEF-if04-port0:/dev/ttyUSB4"
      - "/dev/cdc-wdm0:/dev/cdc-wdm0"   # QMI: VoLTE MBN profil (volitelné)
    volumes:
      - ${APP_DATA_DIR}/data/smsdata:/var/lib/gsm2sip
      - ${APP_DATA_DIR}/data/spool:/var/spool/asterisk/outgoing
      - ${APP_DATA_DIR}/data/astlog:/var/log/asterisk
      # systemd D-Bus hostitele: appka si tím uvolní QMI rozhraní modemu
      # (na většině systémů ho drží ModemManager)
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

  webui:
    # 8091 = provisioning softphonu: musí být dosažitelný z telefonu přímo
    # (Linphone se neumí přihlásit), chrání ho jednorázový token
    ports:
      - "8091:8091"
    image: ghcr.io/twentyone-cz/gsm2sip-webui:0.9.24@sha256:dde269a4b897947ea1f278e9552ba7e6c3403ada94faa7700ecc877638e41f0b
    restart: on-failure
    # zdraví = přihlašovací stránka odpovídá; curl v obraze není,
    # kontrola jde přes python (stdlib)
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/login' % os.environ.get('WEBUI_PORT','8090'), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      TZ: ${TZ:-Europe/Prague}
      WEBUI_PASSWORD: ${APP_PASSWORD}
      WEBUI_PORT: 8090
      AMI_HOST: host.docker.internal
      # AMI_PASSWORD nezná compose (generuje ho asterisk kontejner) — webui
      # si ho přečte ze sdíleného /var/lib/gsm2sip/secrets.env:
      AMI_SECRETS_FILE: /var/lib/gsm2sip/secrets.env
      TS_DIR: /var/lib/gsm2sip/ts
      ACCOUNT_LABEL: ${ACCOUNT_LABEL:-myGSM}   # název účtu v telefonu
      UI_MODE: gui             # spotřebitelský dashboard (Docker default = expert)
      NET_DASHBOARD_URL: ${NET_DASHBOARD_URL:-https://phone.twentyone.cz/pay}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/smsdata:/var/lib/gsm2sip:ro
      - ${APP_DATA_DIR}/data/smsdata/ts:/var/lib/gsm2sip/ts:rw
      # stav ovládání (tajemství 2FA, token brány) — jediné rw místo webui
      # mimo ts/; zakládá a práva nastavuje entrypoint ústředny
      - ${APP_DATA_DIR}/data/smsdata/webui:/var/lib/gsm2sip/webui:rw
      - ${APP_DATA_DIR}/data/astlog:/var/log/asterisk:ro

  tailnet:
    # Privátní síť telefon↔brána. Oficiální tailscale klient s login serverem
    # CockScale (žádná Tailscale Inc. infrastruktura, telemetrie vypnutá).
    # Čeká na auth klíč, který uživatel vloží ve webui (záložka Síť).
    image: tailscale/tailscale:v1.86.2@sha256:241d9518b7e0b6e533dbd0117fcea15acb4174249210837f52b71615949ce9d2
    restart: on-failure
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_NO_LOGS_NO_SUPPORT: "true"
      TS_STATE_DIR: /var/lib/tailscale
      COCKSCALE_URL: ${COCKSCALE_URL:-https://cockscale.twentyone.cz}
    volumes:
      - ${APP_DATA_DIR}/data/ts-state:/var/lib/tailscale
      - ${APP_DATA_DIR}/data/smsdata/ts:/gsm2sip-ts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # počkat na auth klíč z webui, pak up na CockScale login server;
        # tailnet IP zapsat pro asterisk (SIP_DOMAIN) a webui (zobrazení)
        until [ -s /gsm2sip-ts/authkey ] || [ -s /var/lib/tailscale/tailscaled.state ]; do sleep 5; done
        # kernel TUN (host síť + NET_ADMIN): host dostane rozhraní tailscale0,
        # takže SIP/RTP asterisku je dosažitelný na tailnet IP brány
        tailscaled --state=/var/lib/tailscale/tailscaled.state &
        sleep 3
        if [ -s /gsm2sip-ts/authkey ]; then
          tailscale up --login-server="$${COCKSCALE_URL}" --authkey="$$(cat /gsm2sip-ts/authkey)" --accept-dns=false && rm -f /gsm2sip-ts/authkey
        fi
        while true; do
          ip="$$(tailscale ip -4 2>/dev/null | head -1)"
          [ -n "$$ip" ] && echo "$$ip" > /gsm2sip-ts/ip
          sleep 60
        done
