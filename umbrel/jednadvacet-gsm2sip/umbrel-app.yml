releaseNotes: >-
  Ostrovní režim (náhradní internet z mobilních dat) hlídá kvalitu hlasu:
  bez ní hovor přepne modem do starší sítě a data na tu dobu vypadnou —
  aplikace to napíše a spojení po hovoru sama postaví znovu. Připojení
  telefonu ukazuje jediný QR kód, odkaz k opsání zůstal jako záloha.
