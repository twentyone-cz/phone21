releaseNotes: >-
  Nový vzhled ovládání: přehledný dashboard se stavem sítě, telefonu
  a poslední zprávy. Ostrovní režim (náhradní internet z mobilních dat,
  když vypadne linka) se nově zapíná přímo v aplikaci. Záložka Telefon se
  odemkne, až je krabička v privátní síti — dřív by nastavení stejně
  nefungovalo. Nastavení zmeškaných hovorů je na jednom místě.
