category: networking
name: Phone21
version: "0.9.14"
tagline: Tvoje telefonní číslo s tebou kamkoli — přes vlastní miniserver
description: >-
  Phone21 promění USB LTE modem se SIM kartou v soukromou telefonní ústřednu:
  hovory a zprávy z tvého čísla dostaneš do aplikace Phone21 v mobilu, ať jsi
  kdekoli — přes privátní šifrovanou síť, bez veřejné IP a bez port forwardu.
  Zmeškané hovory chodí jako zpráva, zprávy fungují obousměrně, hovory jdou
  po datové síti operátora.


  Potřebuješ podporovaný USB LTE modem a SIM kartu; odladěné sestavy
  a návod najdeš na phone.twentyone.cz. Pro spojení s telefonem na cestách
  je potřeba klíč privátní sítě (bez registrace, platba Lightningem) —
  na domácí síti funguje aplikace i bez něj.


  Phone21 turns a USB LTE modem with your SIM card into a private phone
  system: calls and messages from your number reach the Phone21 app anywhere
  via a private encrypted network — no public IP, no port forwarding needed.
