releaseNotes: >-
  Ostrovní režim (náhradní internet z mobilních dat) hlídá VoLTE: bez něj
  hovor přepne modem do 2G a data na tu dobu vypadnou — aplikace to napíše
  a spojení po hovoru sama postaví znovu. Stav VoLTE je vidět u mobilní
  sítě. Připojení telefonu ukazuje jediný QR kód (přečte ho skener
  v Linphone i běžný fotoaparát), odkaz k opsání zůstal jako záloha.
