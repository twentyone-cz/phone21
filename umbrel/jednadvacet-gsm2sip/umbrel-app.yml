releaseNotes: >-
  Bezpečnost a spolehlivost. Miniserver nově z privátní sítě pouští jen to,
  co telefon potřebuje — hovory, zprávy, ovládání a párování telefonu;
  ostatní služby jsou z privátní sítě zavřené a domácí síť se nemění.
  Vzdálenou správu lze dočasně povolit přepínačem „Povolit ladění" na
  záložce Síť.


  Druhá oprava se týká vzácného zaseknutí ústředny: hlídka ji teď umí
  spolehlivě restartovat i ve chvíli, kdy přestala odpovídat, a kontrola
  zdraví už takový stav nehlásí jako v pořádku.
