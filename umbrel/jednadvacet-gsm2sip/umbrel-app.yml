id: jednadvacet-gsm2sip
category: networking
name: jednadvacet phone
version: "0.9.12"
tagline: Vlastní GSM brána — hovory a SMS z tvé SIM kamkoli přes SIP
description: >-
  GSM2SIP promění USB LTE modem se SIM kartou v soukromou telefonní bránu:
  hovory a SMS z tvého čísla dostaneš do softphonu (Linphone) na mobilu,
  ať jsi kdekoli — přes privátní šifrovanou síť, bez veřejné IP a bez
  port forwardu. Zmeškané hovory chodí jako zpráva do chatu, SMS obousměrně,
  podpora VoLTE (automatická volba carrier profilu modemu).


  Potřebuješ podporovaný USB LTE modem a SIM kartu; odladěné sestavy
  a návod najdeš na phone.twentyone.cz. Pro spojení s telefonem na cestách
  je potřeba klíč privátní sítě (bez registrace, platba Lightningem) —
  na domácí síti funguje appka i bez něj.


  GSM2SIP turns a USB LTE modem with your SIM card into a private phone
  gateway: calls and SMS from your number reach a softphone anywhere via
  a private encrypted network — no public IP, no port forwarding needed.
