releaseNotes: >-
  Spolehlivější volání a lepší zvuk. Když se modem po výpadku nepřipraví
  na hovory nebo SMS, miniserver to sám pozná a modem znovu nastaví — dřív
  mohl zůstat v síti, ale bez možnosti volat. Ovládání nově ukáže, když
  hovory nebo SMS nefungují, a jestli je aplikace v telefonu opravdu
  přihlášená. Protistrana tě uslyší čistěji: zvuk z telefonu se vyrovnává
  a hovor jde v kvalitě 16 kHz. Patří k aplikaci Phone21 6.2.4-21p.42.
