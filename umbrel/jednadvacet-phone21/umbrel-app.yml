releaseNotes: >-
  Spolehlivější hovory: hovor, který přijde během jiného hovoru, už probíhající
  hovor nerozbije — volající slyší vyzvánění a do telefonu přijde zpráva, kdo
  volal. Když se modemu zasekne zvuk, hlídka ho sama restartuje. Zmizela
  falešná hlášení „SMS se nepodařilo odeslat“ u zpráv, které odešly. Ztracený
  nebo ukradený telefon: na záložce Telefon přibylo tlačítko Změnit
  heslo telefonu — odpojí od miniserveru každý telefon se starým heslem, do
  svého pak načteš nový QR kód. Když ovládání otevřeš přes privátní síť, QR
  kód míří tam, takže nový telefon zprovozníš i na dálku. Celý postup je na
  phone.twentyone.cz/kradez.
