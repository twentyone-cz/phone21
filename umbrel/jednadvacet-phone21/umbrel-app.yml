releaseNotes: >-
  Po změně hesla telefonu stačí načíst nový QR kód — telefon nové heslo
  převezme, i když jsi předtím smazal účet. Obnovení stránky po změně hesla
  už heslo nezmění podruhé a během změny se QR kód nenabízí. Volbu přístupu
  přes privátní síť (jen hovory, přístup na miniserver, vše přes miniserver)
  nastavíš i v aplikaci Phone21 v telefonu (od verze 6.2.4-21p.35) —
  miniserver se přizpůsobí a ovládání ukazuje totéž.
