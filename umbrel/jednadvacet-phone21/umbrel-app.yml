releaseNotes: >-
  Ústředna už nespadne po prvním hovoru — dřív se po něm na chvíli
  restartovala a další hovor se nespojil. Vyzvánění u odchozího hovoru je
  teď české, stejné jako na běžném mobilu. Když hovor nevyjde, krátce
  zapípá: pomalu, když je obsazeno nebo volaný hovor odmítl, rychle, když je
  nedostupný nebo má vypnutý telefon (to se pozná nejpozději do 30 sekund,
  dřív se čekalo minutu v tichu). Hlášky operátora před přijetím hovoru
  slyšet nebudou — modem je do hovoru nepouští, místo nich hrál jen vlastní
  zkreslený tón, a ten je teď vypnutý.
