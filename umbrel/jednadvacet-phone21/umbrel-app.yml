releaseNotes: >-
  Do privátní sítě se miniserver připojí sám. Na záložce Síť v ovládání
  přibylo tlačítko „Připojit bránu“ — stačí jednou vložit token z účtu
  sítě a o klíč si miniserver řekne sám. Když bránu ze sítě odregistruješ,
  vrátí se zpátky bez zásahu a ovládání u toho průběžně ukazuje, v jakém
  stavu síť je.


  Telefon nově pozná, který uzel v síti je tvůj miniserver. Volba „i dál
  do sítě“ (miniserver jako výstupní uzel) proto funguje spolehlivě
  a hlavně se dá zase vypnout — dosud zůstala zapnutá a při vypnutém
  miniserveru telefon přišel o připojení k internetu.


  Pozastavenou síť (v účtu došel kredit) pozná ovládání i aplikace
  a napíšou, co s tím; dosud z toho byla jen matoucí hláška o výpadku.


  Jedno QR nastaví telefon včetně účtu, a to i po změně adresy
  miniserveru v privátní síti — po novém načtení kódu zase chodí hovory
  i zprávy, bez ručních úprav v telefonu.


  Oprava doručování: když zpráva nebo upozornění na zmeškaný hovor
  nezastihly telefon, opakovaný pokus se ve skutečnosti nikdy nenaplánoval
  a položka zůstala viset ve frontě. Nově se doručí, jakmile je telefon
  zpátky.


  K této verzi patří aplikace Phone21 6.2.4-21p.34 nebo novější; starší
  verze volbu „i dál do sítě“ neumí vypnout. Aktualizuj proto aplikaci
  v telefonu spolu s miniserverem.
