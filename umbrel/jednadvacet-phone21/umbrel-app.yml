releaseNotes: >-
  Ústředna se po výpadku zvedá klidněji: opakované restarty se od sebe
  rozestupují, takže se miniserver nezahltí, a v záznamech po nich zůstane
  jedna hláška místo nekonečné řady.


  Hlídka modemu už ústřednu nerestartuje, když modem vůbec není připojený —
  restart by stejně nepomohl. Jakmile modem zapojíš, všimne si ho do půl
  minuty a ústřednu zvedne.


  Ostrovní režim (internet přes mobilní síť) se po návratu domácí linky
  vrátí zpátky sám; dosud na mobilních datech zůstal. QR pro telefon
  proto zase nese adresu z domácí sítě, ne adresu od operátora.


  Záznamy o běhu mají nově strop velikosti, takže nemůžou zaplnit úložiště
  miniserveru.


  Jedno QR nastaví telefon včetně účtu, a to i po změně adresy
  miniserveru v privátní síti — po novém načtení kódu zase chodí hovory
  i zprávy, bez ručních úprav v telefonu.


  Oprava doručování: když zpráva nebo upozornění na zmeškaný hovor
  nezastihly telefon, opakovaný pokus se ve skutečnosti nikdy nenaplánoval
  a položka zůstala viset ve frontě. Nově se doručí, jakmile je telefon
  zpátky.


  K této verzi patří aplikace Phone21 6.2.4-21p.34 nebo novější; starší
  verze volbu „i dál do sítě“ neumí vypnout. Aktualizuj proto aplikaci
  v telefonu spolu s miniserverem.
