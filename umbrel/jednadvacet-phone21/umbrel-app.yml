releaseNotes: >-
  Stupeň přístupu do privátní sítě se teď volí v aplikaci Phone21
  v telefonu; ovládání na záložce Síť zvolený stupeň ukazuje. S aplikací
  21p.46 nezabírá výchozí stupeň „jen hovory“ v telefonu místo pro VPN,
  takže vedle Phone21 může běžet VPN jiné aplikace (komerční, firemní…).
  Nápověda, popis aplikace a návody to vysvětlují, včetně případů, kdy
  místo pro VPN potřeba je.
