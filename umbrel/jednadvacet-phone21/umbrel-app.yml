releaseNotes: >-
  Kontakty a kalendář jsou teď společné pro všechna zařízení: každé má vlastní
  přihlášení, takže ztracené zařízení smažeš a ostatní běží dál. Dřívější účty
  se samy přelijí do společného adresáře — hned po aktualizaci v synchronizační
  aplikaci obnov seznam adresářů a zapni nový (na iPhonu účet přidej znovu).
  Import kalendáře z Googlu už neztrácí události
  s připomínkou. V kalendáři je nově připomínka, kdy dojdou kredity sítě,
  a v přehledu volba sítě modemu: maximální bezpečnost (jen 4G), nebo
  maximální konektivita.
