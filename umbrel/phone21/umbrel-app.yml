releaseNotes: >-
  Aplikace se přejmenovala na Phone21 — tohle je její nová položka
  v obchodě. Pokud jsi měl(a) nainstalovanou předchozí verzi, nainstaluj
  tuhle, přenes data podle návodu na phone.twentyone.cz a starou pak
  odinstaluj.


  Novinka: kontakty a kalendář na miniserveru. V ovládání přibyla záložka,
  kde založíš účet pro každé zařízení a naimportuješ kontakty ze starého
  telefonu; telefon i počítač se pak synchronizují doma po wifi
  a na cestách přes privátní síť.


  Dál platí, že miniserver z privátní sítě pouští jen to, co telefon
  potřebuje, a hlídka umí ústřednu spolehlivě restartovat.
