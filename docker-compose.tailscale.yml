# Phone21 — overlay: připojení brány do privátní sítě CockScale (fáze D).
#
# Použití (LXC produkce):
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#
# Auth klíč se vkládá ve webui (záložka Síť) — vygenerovaný na
# https://cockscale.twentyone.cz (Přidat zařízení, platí 24 h, zobrazí se
# jen jednou). Sidecar na klíč počká, připojí se a tailnet IP brány zapisuje
# do runtime/smsdata/ts/ip (webui ji zobrazí; .env SIP_DOMAIN se pak přepne
# na tuto IP: ./configure.sh --force && docker restart asterisk).
#
# TS_NO_LOGS_NO_SUPPORT je POVINNÉ — oficiální klient jinak streamuje
# diagnostiku spojení na log.tailscale.io i proti headscale (issue #2793).

services:
  ui:
    environment:
      TS_DIR: /var/lib/phone21/ts
      NET_DASHBOARD_URL: ${NET_DASHBOARD_URL:-https://phone.twentyone.cz/pay}
    volumes:
      - ./runtime/smsdata/ts:/var/lib/phone21/ts:rw

  net:
    image: tailscale/tailscale:v1.86.2
    container_name: phone21-net
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_NO_LOGS_NO_SUPPORT: "true"
      TS_STATE_DIR: /var/lib/tailscale
      COCKSCALE_URL: ${COCKSCALE_URL:-https://cockscale.twentyone.cz}
    volumes:
      - ./runtime/ts-state:/var/lib/tailscale
      - ./runtime/smsdata/ts:/phone21-ts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ -s /phone21-ts/authkey ] || [ -s /var/lib/tailscale/tailscaled.state ]; do sleep 5; done
        tailscaled --state=/var/lib/tailscale/tailscaled.state &
        sleep 3
        if [ -s /phone21-ts/authkey ]; then
          tailscale up --login-server="$${COCKSCALE_URL}" --authkey="$$(cat /phone21-ts/authkey)" --accept-dns=false && rm -f /phone21-ts/authkey
        fi
        while true; do
          ip="$$(tailscale ip -4 2>/dev/null | head -1)"
          [ -n "$$ip" ] && echo "$$ip" > /phone21-ts/ip
          sleep 60
        done
