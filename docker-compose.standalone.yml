# Phone21 — samostatné nasazení na OBECNÉM dockeru (jakýkoli Linux, x86/ARM).
#
# Na rozdíl od hlavního docker-compose.yml se tady kontejner konfiguruje
# SÁM (tajemství se vygenerují a drží ve volume) a hlídka, profil operátora
# i filtr privátní sítě běží uvnitř. Privátní síť řeší sidecar
# (login server CockScale).
#
# Použití:
#   mkdir -p data/{smsdata,spool,astlog,ts-state}
#   docker compose -f docker-compose.standalone.yml up -d
#   → web UI: http://<host>:8090 (heslo WEBUI_PASSWORD z env/.env)
#   → záložka Síť: vložit klíč privátní sítě; po připojení tam najdeš
#     údaje pro telefon
#
# Env (volitelně přes .env): WEBUI_PASSWORD (povinné), COUNTRY_CODE,
# COCKSCALE_URL, TZ, MODEM_BY_ID (viz níže).

services:
  pbx:
    image: ghcr.io/twentyone-cz/phone21-pbx:0.9.29
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: phone21-pbx
    restart: unless-stopped
    network_mode: host
    # zdraví = ústředna odpovídá na dotaz (diagnostika pro docker ps)
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' | grep -q 'System uptime'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      TZ: ${TZ:-Europe/Prague}
      PHONE21_SELFCONFIG: "1"
      SUPERVISE: "1"
      WATCHDOG_INTERNAL: "1"
      MBN_INTERNAL: "1"
      FIREWALL_INTERNAL: ${FIREWALL_INTERNAL:-1}   # filtr provozu z privátní sítě
      # profil operátora: auto = volba podle mapy operátor→profil (MBN_MAP);
      # mapu lze dodat i souborem mbn.env v datovém adresáři
      MBN_PROFILE: ${MBN_PROFILE:-auto}
      MBN_MAP: ${MBN_MAP:-}
      COUNTRY_CODE: ${COUNTRY_CODE:-420}
      AMI_BIND: 0.0.0.0
      # ovládání běží v mostové síti dockeru → povolit lokální adresy
      AMI_PERMIT: "127.0.0.1/255.255.255.255,172.16.0.0/255.240.0.0"
      # Ostrovní režim: při výpadku domácího internetu přepne krabička
      # default route na data modemu (WWAN_FAILOVER=1 + APN tarifu SIM).
      WWAN_FAILOVER: ${WWAN_FAILOVER:-0}
      WWAN_APN: ${WWAN_APN:-internet}
    cap_add:
      - NET_ADMIN              # ostrovní režim a filtr privátní sítě
    group_add:
      - "20"
    devices:
      - "${MODEM_BY_ID:-/dev/serial/by-id/usb-SimTech__Incorporated_SimTech__Incorporated_0123456789ABCDEF-if02-port0}:/dev/ttyUSB2"
      - "${MODEM_AUDIO_BY_ID:-/dev/serial/by-id/usb-SimTech__Incorporated_SimTech__Incorporated_0123456789ABCDEF-if04-port0}:/dev/ttyUSB4"
      - "/dev/cdc-wdm0:/dev/cdc-wdm0"
    volumes:
      - ./data/smsdata:/var/lib/phone21
      - ./data/spool:/var/spool/asterisk/outgoing
      - ./data/astlog:/var/log/asterisk
      # systemd D-Bus hostitele: uvolnění datového rozhraní modemu
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

  ui:
    image: ghcr.io/twentyone-cz/phone21-ui:0.9.29
    build: ./webui
    container_name: phone21-ui
    restart: unless-stopped
    # zdraví = přihlašovací stránka odpovídá
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/login' % os.environ.get('WEBUI_PORT','8090'), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # 8091 = nastavení telefonu, dosažitelné z telefonu přímo;
    # chrání ho jednorázový token
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      TZ: ${TZ:-Europe/Prague}
      WEBUI_PASSWORD: ${WEBUI_PASSWORD:?nastav WEBUI_PASSWORD}
      WEBUI_PORT: 8090
      AMI_HOST: host.docker.internal
      AMI_SECRETS_FILE: /var/lib/phone21/secrets.env
      TS_DIR: /var/lib/phone21/ts
      DAV_URL: http://dav:5232
      DAV_DIR: /var/lib/phone21-dav
      DAV_PORT: "5232"
      ACCOUNT_LABEL: ${ACCOUNT_LABEL:-myGSM}   # název účtu v telefonu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/smsdata:/var/lib/phone21:ro
      - ./data/smsdata/ts:/var/lib/phone21/ts:rw
      # stav ovládání (2FA, token) — jediné zapisovatelné místo mimo ts/
      - ./data/smsdata/webui:/var/lib/phone21/webui:rw
      - ./data/astlog:/var/log/asterisk:ro

  net:
    image: tailscale/tailscale:v1.86.2
    container_name: phone21-net
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_NO_LOGS_NO_SUPPORT: "true"
      TS_STATE_DIR: /var/lib/tailscale
      COCKSCALE_URL: ${COCKSCALE_URL:-https://cockscale.twentyone.cz}
    volumes:
      - ./data/ts-state:/var/lib/tailscale
      - ./data/smsdata/ts:/phone21-ts
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until [ -s /phone21-ts/authkey ] || [ -s /var/lib/tailscale/tailscaled.state ]; do sleep 5; done
        tailscaled --state=/var/lib/tailscale/tailscaled.state &
        sleep 3
        if [ -s /phone21-ts/authkey ]; then
          tailscale up --login-server="$${COCKSCALE_URL}" --authkey="$$(cat /phone21-ts/authkey)" --accept-dns=false && rm -f /phone21-ts/authkey
        fi
        while true; do
          ip="$$(tailscale ip -4 2>/dev/null | head -1)"
          [ -n "$$ip" ] && echo "$$ip" > /phone21-ts/ip
          sleep 60
        done

  # Kontakty a kalendář (server pro synchronizaci zařízení).
  dav:
    build: ./dav
    container_name: phone21-dav
    restart: on-failure
    ports:
      - "5232:5232"
    environment:
      TZ: ${TZ:-Europe/Prague}
    volumes:
      - ./data/dav:/data
