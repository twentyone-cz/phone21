# Phone21 — miniserver: ústředna + ovladač LTE modemu
#
# Před prvním startem: cp .env.example .env, doplnit hodnoty, spustit ./configure.sh
# (vygeneruje konfiguraci do ${ASTERISK_CONF_DIR}, default ./runtime/asterisk).
#
# Známé omezení: Docker rozbalí symlink zařízení jen při vytvoření kontejneru.
# Po odpojení/zapojení modemu je potřeba kontejner restartovat.
#
# Zařízení modemu jdou dovnitř bind mountem + device_cgroup_rules, ne přes
# `devices:` (důvody v technických poznámkách).

services:
  pbx:
    # Vlastní image (viz docker/). První start: docker compose build.
    # Override image: ASTERISK_IMAGE v .env.
    image: ${ASTERISK_IMAGE:-phone21-pbx:local}
    # context = kořen repa: Dockerfile peče i šablony a skripty
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: phone21-pbx
    network_mode: host          # široký rozsah UDP portů pro hovory
    restart: unless-stopped
    # zdraví = ústředna odpovídá na dotaz (diagnostika pro docker ps)
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' | grep -q 'System uptime'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      TZ: Europe/Prague       # čas v logu
    group_add:
      - "20"                    # dialout (sériové porty modemu)
    device_cgroup_rules:
      - "c 188:* rwm"             # usb-serial (ttyUSB*)
      - "c 180:* rwm"             # datové rozhraní modemu
    volumes:
      - ${ASTERISK_CONF_DIR:-./runtime/asterisk}:/etc/asterisk
      - ./scripts:/usr/local/phone21:ro          # sms-queue.sh (žurnál+retry)
      - ./runtime/smsdata:/var/lib/phone21       # žurnál, fronta, smsdb (persistentní)
      - ./runtime/spool:/var/spool/asterisk/outgoing  # naplánované retry (call files)
      - ./runtime/astlog:/var/log/asterisk       # messages.log pro web UI
      - /dev/ttyUSB2:/dev/ttyUSB2                # servisní port modemu
      - /dev/ttyUSB4:/dev/ttyUSB4                # zvukový port modemu
      - /dev/cdc-wdm0:/dev/cdc-wdm0              # datové rozhraní modemu

  ui:
    build: ./webui
    container_name: phone21-ui
    network_mode: host          # ovládání poslouchá na :8090 (jen domácí síť)
    restart: unless-stopped
    # zdraví = přihlašovací stránka odpovídá
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/login' % os.environ.get('WEBUI_PORT','8090'), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - pbx
    environment:
      TZ: Europe/Prague
      AMI_PASSWORD: ${AMI_PASSWORD}
      WEBUI_PASSWORD: ${WEBUI_PASSWORD}
      WEBUI_PORT: ${WEBUI_PORT:-8090}
      SIP_USER: ${SIP_USER}
      SIP_DOMAIN: ${SIP_DOMAIN}
      COUNTRY_CODE: ${COUNTRY_CODE:-420}  # normalizace čísel na mezinárodní tvar
    volumes:
      - ./runtime/smsdata:/var/lib/phone21:ro
      # stav ovládání (2FA, token) — jediné místo, kam ovládání zapisuje
      - ./runtime/smsdata/webui:/var/lib/phone21/webui:rw
      - ./runtime/astlog:/var/log/asterisk:ro
