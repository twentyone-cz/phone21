# GSM2SIP — brána: Asterisk + ovladač LTE modemu
#
# Před prvním startem: cp .env.example .env, doplnit hodnoty, spustit ./configure.sh
# (vygeneruje konfiguraci do ${ASTERISK_CONF_DIR}, default ./runtime/asterisk).
#
# Známé omezení: Docker rozbalí symlink zařízení jen při vytvoření kontejneru.
# Po odpojení/zapojení modemu je potřeba kontejner restartovat.

services:
  asterisk:
    # Vlastní image (viz docker/). První start: docker compose build.
    # Override image: ASTERISK_IMAGE v .env.
    image: ${ASTERISK_IMAGE:-gsm2sip-asterisk:local}
    # context = kořen repa: Dockerfile peče i asterisk/ šablony a scripts/
    # (selfkonfigurace pro Umbrel; LXC režim se nemění — viz entrypoint.sh)
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: asterisk
    network_mode: host          # RTP = široký rozsah UDP portů, žádný port mapping
    restart: unless-stopped
    environment:
      TZ: Europe/Prague       # jinak kontejner loguje v UTC (2h posun proti realitě)
    group_add:
      - "20"                    # dialout (root:dialout 0660 na ttyUSB) — Asterisk neběží jako root
    devices:
      - "/dev/serial/by-id/usb-SimTech__Incorporated_SimTech__Incorporated_0123456789ABCDEF-if02-port0:/dev/ttyUSB2"
      - "/dev/serial/by-id/usb-SimTech__Incorporated_SimTech__Incorporated_0123456789ABCDEF-if04-port0:/dev/ttyUSB4"
    volumes:
      - ${ASTERISK_CONF_DIR:-./runtime/asterisk}:/etc/asterisk
      - ./scripts:/usr/local/gsm2sip:ro          # sms-queue.sh (žurnál+retry)
      - ./runtime/smsdata:/var/lib/gsm2sip       # žurnál, fronta, smsdb (persistentní)
      - ./runtime/spool:/var/spool/asterisk/outgoing  # naplánované retry (call files)
      - ./runtime/astlog:/var/log/asterisk       # messages.log pro web UI

  webui:
    build: ./webui
    container_name: gsm2sip-webui
    network_mode: host          # AMI na 127.0.0.1; UI poslouchá na :8090 (jen LAN/WG!)
    restart: unless-stopped
    depends_on:
      - asterisk
    environment:
      TZ: Europe/Prague
      AMI_PASSWORD: ${AMI_PASSWORD}
      WEBUI_PASSWORD: ${WEBUI_PASSWORD}
      WEBUI_PORT: ${WEBUI_PORT:-8090}
      SIP_USER: ${SIP_USER}
      SIP_DOMAIN: ${SIP_DOMAIN}
      COUNTRY_CODE: ${COUNTRY_CODE:-420}  # normalizace čísel na E.164 (viz dialplan)
    volumes:
      - ./runtime/smsdata:/var/lib/gsm2sip:ro
      - ./runtime/astlog:/var/log/asterisk:ro
